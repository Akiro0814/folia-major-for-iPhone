# .github/workflows/ios-build.yml
name: iOS unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', 'ios-web/**', 'src/**', 'dev/icuFolia/**', 'public/**', 'package*.json', '.github/workflows/ios-build.yml']
  pull_request:
    paths: ['ios/**', 'ios-web/**', '.github/workflows/ios-build.yml']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun simctl list devices available
      - name: Install web dependencies without desktop native installers
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test native-web clock bridge
        run: node --test ios-web/bridge.test.mjs
      - name: Bundle Folia lyrics
        run: npm run build:ios-lyrics
      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Native unit and UI tests
        run: |
          mkdir -p artifacts/ios
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; matches=[v["udid"] for k,vs in d.items() if "iOS-26" in k for v in vs if v["name"].startswith("iPhone")]; assert matches,"iOS 26 simulator missing"; print(matches[0])')
          xcodebuild test -project ios/Folia.xcodeproj -scheme Folia -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -resultBundlePath artifacts/ios/Tests.xcresult CODE_SIGNING_ALLOWED=NO | tee artifacts/ios/tests.log
      - name: Build and validate unsigned IPA
        run: bash ios/Scripts/build-unsigned.sh
      - name: Export UI test screenshots
        if: always()
        run: |
          if [ -d artifacts/ios/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path artifacts/ios/Tests.xcresult --output-path artifacts/ios/screenshots || true
          fi
      - name: Upload IPA and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Folia-iOS-unsigned-${{ github.run_number }}
          path: |
            artifacts/ios/*.ipa
            artifacts/ios/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Folia-iOS-validation-${{ github.run_number }}
          path: |
            artifacts/ios/*.txt
            artifacts/ios/*.log
            artifacts/ios/screenshots
            artifacts/ios/Tests.xcresult
          retention-days: 14
